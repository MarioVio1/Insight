<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insight Configurator</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient">
    <div class="ambient-glow ag-1"></div>
    <div class="ambient-glow ag-2"></div>
    <div class="ambient-glow ag-3"></div>
  </div>

  <div id="app">
    <!-- NAV -->
    <nav class="nav">
      <div class="nav-brand">
        <svg width="32" height="32" viewBox="0 0 256 256">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
          <rect width="256" height="256" rx="48" fill="url(#lg)"/>
          <g transform="translate(128,128)"><polygon points="-40,-60 40,-60 0,60" fill="#ffffff" opacity="0.95"/><polygon points="-20,-30 20,-30 0,30" fill="#0ea5e9"/></g>
        </svg>
        <span>Insight</span>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-section="setup"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Setup</button>
        <button class="nav-tab" data-section="cards">Cards</button>
        <button class="nav-tab" data-section="preview">Preview</button>
        <button class="nav-tab" data-section="install">Install</button>
      </div>
      <div class="nav-actions">
        <span id="accountBadge" class="hide tag tag-success"><span id="uname"></span></span>
      </div>
    </nav>

    <!-- WORKSPACE -->
    <div class="workspace">
      <div class="workspace-grid">

        <!-- COL 1: Setup + Cards (controls) -->
        <div class="panel" style="grid-column:1">
          <div class="panel-header"><h3>Configurator</h3></div>
          <div class="panel-body" id="panelBody">

            <!-- SECTION: Setup -->
            <div class="p-section" id="section-setup">
              <div class="p-section-title">Setup</div>
              <div class="step">
                <p>Crea o apri la tua configurazione personale</p>
                <form id="createForm" class="slug">
                  <div class="slug-in"><span class="slug-px">insight.to/</span><input type="text" id="slugInput" placeholder="mario123" required autocomplete="off" spellcheck="false"></div>
                  <button class="btn btn-primary" type="submit" id="createBtn">Crea</button>
                </form>
              </div>
            </div>

            <!-- SECTION: Trakt -->
            <div class="p-section hide" id="section-trakt">
              <div class="p-section-title">Trakt</div>
              <div class="step">
                <p>Autorizza l'accesso alla cronologia di Trakt.tv</p>
                <div class="inp-wrap">
                  <a id="loginBtn" class="btn btn-primary" href="#">
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm-1 5l4 3-4 3V7z" fill="#000"/></svg>
                    Collega
                  </a>
                  <span id="syncInfoMini" style="font-size:11px;color:var(--m)"></span>
                </div>
              </div>
            </div>

            <!-- SECTION: Cards -->
            <div class="p-section hide" id="section-cards">
              <div class="p-section-title">Cards</div>

              <div style="margin-bottom:10px">
                <div class="seg">
                  <button class="seg-btn active" data-tab="all">Tutte</button>
                  <button class="seg-btn" data-tab="stats">Stats</button>
                  <button class="seg-btn" data-tab="content">Contenuti</button>
                  <button class="seg-btn" data-tab="time">Tempo</button>
                </div>
              </div>

              <form id="prefsForm">
                <div class="chip-grid" id="chipGrid">
                  <label class="chip active" data-cat="stats" data-val="totals"><span class="chip-dot" style="background:#22c55e"></span><input type="checkbox" name="c" value="totals" checked hidden><span>Totali</span></label>
                  <label class="chip active" data-cat="stats" data-val="streak"><span class="chip-dot" style="background:#f97316"></span><input type="checkbox" name="c" value="streak" checked hidden><span>Streak</span></label>
                  <label class="chip active" data-cat="time" data-val="peak"><span class="chip-dot" style="background:#a855f7"></span><input type="checkbox" name="c" value="peak" checked hidden><span>Orario top</span></label>
                  <label class="chip active" data-cat="time" data-val="weekly"><span class="chip-dot" style="background:#38bdf8"></span><input type="checkbox" name="c" value="weekly" checked hidden><span>Giorno top</span></label>
                  <label class="chip active" data-cat="content" data-val="genre"><span class="chip-dot" style="background:#a855f7"></span><input type="checkbox" name="c" value="genre" checked hidden><span>Generi</span></label>
                  <label class="chip active" data-cat="content" data-val="binge"><span class="chip-dot" style="background:#ef4444"></span><input type="checkbox" name="c" value="binge" checked hidden><span>Binge</span></label>
                  <label class="chip" data-cat="content" data-val="dropped"><span class="chip-dot" style="background:#6b7280"></span><input type="checkbox" name="c" value="dropped" hidden><span>In pausa</span></label>
                  <label class="chip" data-cat="stats" data-val="monthly"><span class="chip-dot" style="background:#14b8a6"></span><input type="checkbox" name="c" value="monthly" hidden><span>Mensile</span></label>
                  <label class="chip" data-cat="time" data-val="recurring"><span class="chip-dot" style="background:#f59e0b"></span><input type="checkbox" name="c" value="recurring" hidden><span>Ricorrenze</span></label>
                  <label class="chip" data-cat="content" data-val="rewatch"><span class="chip-dot" style="background:#ef4444"></span><input type="checkbox" name="c" value="rewatch" hidden><span>Rewatch</span></label>
                  <label class="chip" data-cat="time" data-val="seasonal"><span class="chip-dot" style="background:#0ea5e9"></span><input type="checkbox" name="c" value="seasonal" hidden><span>Stagionale</span></label>
                  <label class="chip" data-cat="content" data-val="actor"><span class="chip-dot" style="background:#ec4899"></span><input type="checkbox" name="c" value="actor" hidden><span>Attori</span></label>
                  <label class="chip" data-cat="content" data-val="director"><span class="chip-dot" style="background:#8b5cf6"></span><input type="checkbox" name="c" value="director" hidden><span>Registi</span></label>
                  <label class="chip" data-cat="content" data-val="anime"><span class="chip-dot" style="background:#f43f5e"></span><input type="checkbox" name="c" value="anime" hidden><span>Anime</span></label>
                  <label class="chip" data-cat="stats" data-val="ranking"><span class="chip-dot" style="background:#fbbf24"></span><input type="checkbox" name="c" value="ranking" hidden><span>Classifica</span></label>
                  <label class="chip" data-cat="time" data-val="memories"><span class="chip-dot" style="background:#d946ef"></span><input type="checkbox" name="c" value="memories" hidden><span>Ricordi</span></label>
                  <label class="chip" data-cat="stats" data-val="giorni"><span class="chip-dot" style="background:#06b6d4"></span><input type="checkbox" name="c" value="giorni" hidden><span>Giorni</span></label>
                  <label class="chip" data-cat="stats" data-val="migliore"><span class="chip-dot" style="background:#fbbf24"></span><input type="checkbox" name="c" value="migliore" hidden><span>Miglior anno</span></label>
                  <label class="chip" data-cat="stats" data-val="anno"><span class="chip-dot" style="background:#84cc16"></span><input type="checkbox" name="c" value="anno" hidden><span>Anno in corso</span></label>
                  <label class="chip" data-cat="time" data-val="mese"><span class="chip-dot" style="background:#a3e635"></span><input type="checkbox" name="c" value="mese" hidden><span>Mese top</span></label>
                  <label class="chip" data-cat="stats" data-val="split"><span class="chip-dot" style="background:#2dd4bf"></span><input type="checkbox" name="c" value="split" hidden><span>Film/Serie</span></label>
                  <label class="chip" data-cat="time" data-val="notturno"><span class="chip-dot" style="background:#6366f1"></span><input type="checkbox" name="c" value="notturno" hidden><span>Fascia oraria</span></label>
                </div>

                <div class="inp-wrap" style="margin-bottom:10px">
                  <select class="sel" id="focusMode" style="flex:1">
                    <option value="adaptive">Modalità focus: Adaptive</option>
                    <option value="movies">Solo film</option>
                    <option value="series">Solo serie</option>
                  </select>
                  <button type="submit" class="btn btn-primary btn-sm" id="savePrefsBtn">Salva</button>
                </div>
              </form>
            </div>

            <!-- Sync -->
            <div class="p-section hide" id="section-sync">
              <button id="syncBtn" class="btn btn-primary" style="width:100%">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 0112 0M16 10l-3-3M4 10l3-3" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
                Sincronizza con Trakt
              </button>
              <div id="syncStatus" class="ssync"></div>
            </div>

          </div>
        </div>

        <!-- COL 2: Preview -->
        <div class="panel" style="grid-column:2">
          <div class="panel-header">
            <h3>Preview</h3>
            <div style="margin-left:auto;display:flex;gap:6px">
              <button id="refreshPreviewBtn" class="btn btn-ghost btn-icon" title="Refresh"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 0112 0M16 10l-3-3M4 10l3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
          </div>
          <div class="panel-body">
            <div class="pgrid" id="previewGrid">
              <div class="pempty"><p>Fai il sync per vedere le card</p></div>
            </div>
          </div>
        </div>

        <!-- COL 3: Install + Status -->
        <div class="panel" style="grid-column:3">
          <div class="panel-header"><h3>Install</h3></div>
          <div class="panel-body">

            <!-- Token -->
            <div class="p-section hide" id="section-token">
              <div class="p-section-title">Token</div>
              <div class="tbox">
                <span class="tbox-label">Token</span>
                <span class="tbox-val" id="udidValue"></span>
                <button id="udidCopyBtn" class="btn btn-ghost btn-icon" title="Copia"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="4" y="4" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 2h6a2 2 0 012 2v10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
              </div>
            </div>

            <!-- Manifest -->
            <div class="p-section">
              <div class="p-section-title">Manifest URL</div>
              <div class="mbox">
                <code id="manifestBox"></code>
                <button id="installBtn" class="btn btn-primary btn-sm">Copia</button>
              </div>
              <p class="hint" id="syncInfo"></p>
            </div>

            <!-- Status -->
            <div class="p-section" id="section-status">
              <div class="p-section-title">Stato</div>
              <div class="sinfo">
                <div class="srow"><span class="sl">Tabelle:</span><span class="sdot pending" id="sTables"></span></div>
                <div class="srow"><span class="sl">Trakt:</span><span class="sdot pending" id="sTrakt"></span></div>
                <div class="srow"><span class="sl">Sync:</span><span id="sSync">—</span></div>
                <div class="srow"><span class="sl">Cards:</span><span id="sCards">—</span></div>
              </div>
              <div class="sissues" id="sIssues"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/config.js"></script>
</body>
</html>
